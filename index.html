<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>생신 축하 ATM</title>
<style>
  :root {
    --body: #11161d;
    --screen: #0b3d5c;
    --screen-light: #12557f;
    --text: #e8f4ff;
    --accent: #ffd34d;
    --ok: #2fb36b;
    --no: #d94848;
    --go: #2d7fd3;
    --heart: #ff4d6d;
  }
  /* ATM 화면은 항상 어두운 테마를 유지합니다 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --body: #11161d; }
  }
  :root[data-theme="dark"] { --body: #11161d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--body);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  /* 화면 크기에 맞춰 16:9 비율을 유지 */
  .screen {
    width: min(100%, calc((100vh - 32px) * 16 / 9));
    aspect-ratio: 16 / 9;
    font-size: clamp(8px, min(1.6vw, 2.85vh), 22px);
    background: linear-gradient(160deg, var(--screen-light), var(--screen));
    border: 0.8em solid #222;
    border-radius: 0.8em;
    color: var(--text);
    padding: 1.6em 2.4em;
    display: flex; flex-direction: column;
    box-shadow: 0 1.5em 4em rgba(0,0,0,.6), inset 0 0 3em rgba(0,0,0,.5);
    position: relative; overflow: hidden;
  }
  .screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 2px, transparent 2px 4px);
  }
  .top { display: flex; justify-content: space-between; font-size: 1em; }
  .brand { font-weight: 800; letter-spacing: .15em; opacity: .85; }
  .brand span { color: var(--accent); }
  .step { color: var(--accent); }
  .msg {
    flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; font-size: 2.2em; line-height: 1.5; word-break: keep-all;
  }
  .msg small { display: block; font-size: .55em; opacity: .8; margin-top: .6em; }
  .msg .big { font-size: 1.3em; font-weight: 800; color: var(--accent); }
  .heart-row { display: flex; align-items: center; justify-content: center; gap: 1em; }
  .heart-btn {
    font-size: 2em; width: 2.2em; height: 2.2em; border-radius: 50%;
    border: .08em solid #fff; background: var(--heart); color: #fff; cursor: pointer;
    box-shadow: 0 .15em 0 rgba(0,0,0,.35); flex: none; line-height: 1;
    font-family: inherit;
  }
  .heart-btn:active { transform: scale(.9); }
  .heart-btn.full { opacity: .5; cursor: default; transform: none; }
  .float-heart { position: absolute; pointer-events: none; font-size: 2.4em; animation: up 1s ease-out forwards; z-index: 5; }
  @keyframes up { to { transform: translateY(-5em) scale(1.4); opacity: 0; } }
  .choices { display: flex; gap: 1.2em; justify-content: center; }
  .choices button {
    width: 30%; font-size: 1.8em; font-weight: 700; padding: .55em 0;
    border: none; border-radius: .35em; color: #fff; cursor: pointer;
    font-family: inherit; box-shadow: 0 .2em 0 rgba(0,0,0,.35);
  }
  .choices button:active { transform: translateY(.12em); box-shadow: 0 .05em 0 rgba(0,0,0,.35); }
  .yes { background: var(--ok); }
  .no { background: var(--no); }
  .go { background: var(--go); }
  .shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  .blink { animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .msg { min-height: 0; }
  .msg video { height: 100%; max-width: 100%; border-radius: .4em; background: #000; box-shadow: 0 .5em 1.5em rgba(0,0,0,.5); margin-bottom: .8em; }
  .home-btn {
    position: absolute; right: 1.2em; bottom: 1em; z-index: 2;
    font-size: .85em; font-family: inherit; color: var(--text);
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.25);
    border-radius: .4em; padding: .35em .8em; cursor: pointer; opacity: .6;
  }
  .home-btn:hover { opacity: 1; }
  .confetti { position: fixed; top: -20px; width: 10px; height: 14px; pointer-events: none; z-index: 10; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="top">
    <div class="brand">💳 <span>HAPPY</span> BIRTHDAY BANK</div>
    <div class="step" id="step"></div>
  </div>
  <div class="msg" id="msg"></div>
  <div id="controls"></div>
</div>

<script>
  const questions = [
    { type: "yn", text: "아버님의 성함이 <span class='big'>'양재곤'</span><br>맞으십니까?", answer: true },
    { type: "yn", text: "아버님 칠순을 위한 여행지가 <span class='big'>'강원도'</span><br>맞으십니까?", answer: true },
    { type: "yn", text: "아버님의 자녀가 <span class='big'>3명</span><br>맞으십니까?", answer: true },
    { type: "heart", text: "가족을 사랑하는 만큼<br>하트를 눌러주세요." },
    { type: "yn", text: "오늘이 <span class='big'>생신</span>이십니까?", answer: true },
  ];

  const $ = id => document.getElementById(id);
  const screen = $("screen"), stepEl = $("step"), msgEl = $("msg"), controls = $("controls");
  const HEARTS_TO_PASS = 10;
  // Claude 배포 페이지에서는 업로드한 영상을, 깃허브 페이지나 내 컴퓨터에서는 옆에 둔 파일을 재생
  const isLocalCopy = location.protocol === "file:" || location.hostname.endsWith("github.io");
  const VIDEO_SRC = isLocalCopy ? "birthday.mp4?v=2" : "/_blob/7c341b121e6a3d0d845ff537ec065859";
  let current = -1, hearts = 0;

  function render(stepText, html, controlsHtml) {
    stepEl.textContent = stepText;
    msgEl.innerHTML = html;
    controls.innerHTML = controlsHtml || "";
  }

  function shake() {
    screen.classList.remove("shake"); void screen.offsetWidth; screen.classList.add("shake");
  }

  function showStart() {
    current = -1; hearts = 0;
    render("", "어서 오십시오.<br><span class='big'>본인 확인</span>을 시작합니다.<small class='blink'>[시작] 버튼을 눌러 주십시오</small>",
      "<div class='choices'><button class='go' onclick='next()'>시작</button></div>");
  }

  function next() {
    current++;
    if (current >= questions.length) return showVideoPrompt();
    const q = questions[current];
    const step = `본인 확인 ${current + 1} / ${questions.length}`;
    if (q.type === "yn") {
      render(step, q.text,
        "<div class='choices'><button class='yes' onclick='answer(true)'>예</button><button class='no' onclick='answer(false)'>아니오</button></div>");
    } else {
      hearts = 0;
      render(step,
        `<div class='heart-row'><div>${q.text}</div><button class='heart-btn' id='heartBtn' aria-label='하트'>♥</button></div>`);
      $("heartBtn").addEventListener("click", addHeart);
    }
  }

  function answer(val) {
    if (val === questions[current].answer) return next();
    shake();
    render(stepEl.textContent, "⚠️ 본인 확인에 실패했습니다.<small>다시 한 번 신중하게 선택해 주십시오.</small>",
      "<div class='choices'><button class='go' onclick='retry()'>다시 시도</button></div>");
  }

  function retry() { current--; next(); }

  function addHeart(e) {
    if (hearts >= HEARTS_TO_PASS) return;
    hearts++;
    if (hearts === HEARTS_TO_PASS) {
      e.currentTarget.classList.add("full");
      setTimeout(next, 900);
    }
    const r = screen.getBoundingClientRect(), b = e.currentTarget.getBoundingClientRect();
    const h = document.createElement("div");
    h.className = "float-heart";
    h.textContent = ["❤️", "💖", "💗", "💕"][hearts % 4];
    h.style.left = (b.left - r.left + b.width / 2 - 20 + (Math.random() * 40 - 20)) + "px";
    h.style.top = (b.top - r.top) + "px";
    screen.appendChild(h);
    setTimeout(() => h.remove(), 1000);
  }

  function showVideoPrompt() {
    render("본인 확인 완료 ✔", "🎬<br><span class='big'>축하 영상</span>이 도착했습니다.<br>확인하시겠습니까?",
      "<div class='choices'><button class='yes' onclick='playVideo()'>예</button><button class='no' onclick='showFinal()'>아니오</button></div>");
  }

  function playVideo() {
    render("축하 영상 🎬", `<video id='video' src='${VIDEO_SRC}' playsinline controls></video>`);
    const v = $("video");
    v.addEventListener("ended", showFinal);
    v.play().catch(() => {});
  }

  function showFinal() {
    render("본인 확인 완료 ✔",
      `🎉🎂🎉<br><span class='big'>생신을 축하드립니다!</span><br>카드를 꽂으시면 인출을 시작합니다.<small>가족의 사랑을 가득 담았습니다 💖</small>`,
      "<button class='home-btn' onclick='showStart()'>↺ 처음으로</button>");
    confetti();
  }

  function confetti() {
    const colors = ["#ffd34d", "#ff6b6b", "#4dd0ff", "#7cff8f", "#ff9de2"];
    for (let i = 0; i < 80; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = 2.5 + Math.random() * 2.5 + "s";
      c.style.animationDelay = Math.random() * 1.5 + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 6500);
    }
  }

  showStart();
</script>
</body>
</html>
